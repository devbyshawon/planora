<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#3658b8" />
    <title>Planora — Connection needed</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/offline.css" />
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main>
      <span class="brand">PLANORA</span>
      <h1>Let’s reconnect.</h1>
      <p>Planora couldn’t reach the service. Check your internet connection and try again. The service may also need a moment to wake up.</p>
      <p>Your planner needs a connection to load and save tasks. Changes aren’t queued while offline.</p>
      <button id="retry" type="button">Try again</button>
      <p id="connection" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
